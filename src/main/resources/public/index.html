<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen gap-8">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-96">
        <h2 class="text-2xl font-bold text-slate-800 mb-6">Welcome Back</h2>
        <form action="/login" method="post" class="space-y-4">
            <input type="text" name="username" placeholder="Username" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="password" name="password" placeholder="Password" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">Login</button>
        </form>
    </div>
    <div class="bg-white p-8 rounded-2xl shadow-xl w-96 border-t-4 border-green-500">
        <h2 class="text-2xl font-bold text-slate-800 mb-6">Create Account</h2>
        <form action="/signup" method="post" class="space-y-4">
            <input type="text" name="username" placeholder="New Username" class="w-full p-3 border rounded-lg outline-none">
            <input type="password" name="password" placeholder="New Password" class="w-full p-3 border rounded-lg outline-none">
            <button class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">Register</button>
        </form>
    </div>
</body>
</html>
